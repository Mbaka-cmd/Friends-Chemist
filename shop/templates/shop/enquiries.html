{% extends "shop/base.html" %}{% block content %}<h1>{{ info.name }} enquiries</h1><div class="tw"><table><tr><th>When</th><th>Name</th><th>Phone</th><th>Product</th><th>Message</th><th>Status</th></tr>
{% for e in items %}<tr><td>{{ e.created|date:"d M H:i" }}</td><td>{{ e.name }}</td><td>{{ e.phone }}</td><td>{{ e.product.name }}</td><td>{{ e.message }}</td><td><form method="post">{% csrf_token %}<input type="hidden" name="id" value="{{ e.id }}"><select name="status" onchange="this.form.submit()">{% for k,v in e.status.field.choices|default:"" %}{% endfor %}<option value="new" {% if e.status == 'new' %}selected{% endif %}>New</option><option value="contacted" {% if e.status == 'contacted' %}selected{% endif %}>Contacted</option><option value="closed" {% if e.status == 'closed' %}selected{% endif %}>Closed</option></select></form></td></tr>{% empty %}<tr><td>No enquiries.</td></tr>{% endfor %}</table></div>{% endblock %}
